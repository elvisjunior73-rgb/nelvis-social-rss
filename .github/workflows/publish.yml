name: Évangile du matin - Facebook
on:
  workflow_dispatch:
  schedule:
    # 06:00 Paris: UTC+1 hiver / UTC+2 été
    - cron: '0 4,5 * * *'
permissions:
  contents: read
concurrency:
  group: gospel-facebook
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node src/morning.js
        env:
          FACEBOOK_PAGE_TOKEN_MISERICORDE: ${{ secrets.FACEBOOK_PAGE_TOKEN_MISERICORDE }}
          FACEBOOK_PAGE_TOKEN_ROSAIRE: ${{ secrets.FACEBOOK_PAGE_TOKEN_ROSAIRE }}
          FACEBOOK_PAGE_ID_MISERICORDE: ${{ vars.FACEBOOK_PAGE_ID_MISERICORDE }}
          FACEBOOK_PAGE_ID_ROSAIRE: ${{ vars.FACEBOOK_PAGE_ID_ROSAIRE }}
          AELF_RSS_URL: ${{ vars.AELF_RSS_URL }}
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
